<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SigOne CRM · Mantenedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/primeicons/primeicons.css">
<link rel="stylesheet" href="assets/styles.css?v=20261019c">
<style>
  .filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .filters .search{flex:1;min-width:230px;max-width:360px;margin-left:auto}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
  .seg button{padding:9px 16px;border-radius:10px;font-weight:700;color:#4B5368;display:flex;gap:8px;align-items:center;transition:.15s}
  .seg button:hover{color:var(--orange)}
  .seg button.on{background:var(--navy);color:#fff}
  .seg button i{font-style:normal;font-size:11.5px;background:#EEF0F5;color:#5A6379;border-radius:99px;padding:1px 8px}
  .seg button.on i{background:rgba(255,255,255,.18);color:#fff}
  .only{display:flex;gap:8px;align-items:center;color:#4B5368;font-weight:600;cursor:pointer}
  .chk{width:17px;height:17px;accent-color:var(--orange)}
  .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .ucard{padding:22px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;--c:var(--orange)}
  .ucard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
  .ucard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(19,26,42,.10)}
  .ucard.inactive{opacity:.7}
  .ucard.r-Administrador{--c:#DC2626}.ucard.r-Supervisor{--c:#3B6FE0}.ucard.r-Vendedor{--c:#F47B20}
  .u-top{display:flex;gap:14px;align-items:center}
  .u-top .avatar{width:54px;height:54px;font-size:18px}
  .u-top .who{min-width:0;flex:1}.u-top b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-top small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-mid{display:flex;gap:8px;margin:18px 0 16px;flex-wrap:wrap}
  .u-bot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:14px;color:var(--muted);font-size:13px}
  .u-bot span{display:flex;gap:6px;align-items:center}
  .sw{width:40px;height:22px;border-radius:99px;background:#D5D9E4;position:relative;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw.on{background:var(--green)}.sw.on::after{left:21px}
  .kebab{position:relative}
  .kebab>button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#3A4257}
  .kebab>button:hover{background:var(--bg)}
  .menu{position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 34px rgba(19,26,42,.16);min-width:160px;padding:6px;z-index:20;display:none}
  .menu.open{display:block}
  .menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:8px;font-weight:600;text-align:left}
  .menu button:hover{background:var(--orange-50);color:var(--orange-600)}
  .menu button.del:hover{background:var(--red-50);color:var(--red)}
  .foot-note{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
  .tl{display:grid;max-height:52vh;overflow:auto}
  .tl-i{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--border)}
  .tl-d{width:11px;height:11px;border-radius:50%;background:var(--orange);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--orange-50)}
  .tl-v{margin:4px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tl-v s{color:var(--muted)}.tl-v .arrow{transform:rotate(-90deg);color:#9AA1B4}
  .tl small{color:var(--muted)}
  .role-hint{font-size:12.5px;color:var(--muted);margin-top:6px}
</style>
</head>
<body data-module="mantenedores" data-side="usuarios">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <div class="crumb">Mantenedores <i data-icon="chevron" style="transform:rotate(-90deg)"></i> <b>Usuarios</b></div>
          <h1>Usuarios y roles</h1>
          <p>Administra las personas que acceden al CRM y el rol de cada una</p>
        </div>
        <button class="btn btn-primary" id="btnNew"><i data-icon="plus"></i>Nuevo usuario</button>
      </div>

      <div class="filters">
        <div class="seg" id="seg"></div>
        <div class="search"><i data-icon="search"></i><input class="input" id="q" placeholder="Buscar por nombre o correo"></div>
        <label class="only"><input type="checkbox" id="onlyActive" class="chk"> Solo activos</label>
      </div>
      <section class="card" style="overflow:hidden">
        <div style="overflow:auto"><table class="dgrid"><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th class="r">Acciones</th></tr></thead><tbody id="grid"></tbody></table></div>
        <div class="pager" id="pager"></div>
      </section>
      
    </main>
  </div>
</div>

<!-- Modal crear / editar usuario -->
<div class="modal-bg" id="modal">
  <form class="modal" id="uForm" novalidate>
    <div class="modal-h"><h3 id="mTitle">Nuevo usuario</h3><button type="button" class="icon-btn" id="mClose" aria-label="Cerrar"><i data-icon="x"></i></button></div>
    <div class="modal-b">
      <div class="field"><label>Nombre completo</label><input class="input" id="fNom" placeholder="Ej. Juan Perez"></div>
      <div class="field"><label>Correo electrónico</label><input class="input" id="fMail" type="email" placeholder="usuario@sigcomt.com"></div>
      <div class="grid-2">
        <div class="field"><label>Rol</label><select class="select" id="fRolSel"><option>Vendedor</option><option>Supervisor</option><option>Administrador</option></select></div>
        <div class="field"><label>Estado</label><select class="select" id="fEstSel"><option value="1">Activo</option><option value="0">Inactivo</option></select></div>
      </div>
      <div class="role-hint" id="roleHint"></div>
      <div class="login-err" id="mErr" hidden>Completa nombre y un correo válido.</div>
    </div>
    <div class="modal-f"><button type="button" class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div>
  </form>
</div>

<!-- Modal Historial -->
<div class="modal-bg" id="hModal"><div class="modal">
  <div class="modal-h"><h3 id="hTitle">Historial</h3><button type="button" class="icon-btn" id="hClose" aria-label="Cerrar"><i data-icon="x"></i></button></div>
  <div class="modal-b" id="hBody"></div>
  <div class="modal-f"><button type="button" class="btn btn-primary" id="hOk">Cerrar</button></div>
</div></div>

<script src="assets/app.js?v=20261019c"></script>
<script src="assets/mantenedores.js?v=20261019c"></script>
</body>
</html>
